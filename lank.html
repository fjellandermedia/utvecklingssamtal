<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Skapa bokningslänk</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1c2430; --muted: #5d6877;
    --border: #dde2e8; --accent: #1f5fbf; --accent-text: #ffffff; --ok: #1e7a46;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --surface: #1b2129; --text: #e8ecf1; --muted: #9aa5b3;
      --border: #2e3742; --accent: #6aa3f5; --accent-text: #0d1420; --ok: #6fd39a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  label { display: block; font-weight: 600; margin: 0 0 4px; }
  input { width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #resultat { margin-top: 20px; }
  .lank { word-break: break-all; font-family: ui-monospace, monospace; font-size: .9rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .rad { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button, a.knapp { padding: 10px 16px; font: inherit; font-weight: 600; border-radius: 8px; border: 0; cursor: pointer; text-decoration: none; background: var(--accent); color: var(--accent-text); }
  a.knapp { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .kopierad { color: var(--ok); align-self: center; }
</style>
</head>
<body>
<main>
  <h1>Skapa bokningslänk</h1>
  <p>Skriv in din skolmejl så får du länken du ska skicka till vårdnadshavarna.</p>
  <div class="card">
    <label for="mejl">Din mejladress</label>
    <input type="email" id="mejl" autocomplete="email" placeholder="fornamn.efternamn@edu.varnamo.se">
    <div id="resultat" hidden>
      <label>Din bokningslänk</label>
      <div class="lank" id="lank"></div>
      <div class="rad">
        <button type="button" id="kopiera">Kopiera länken</button>
        <a class="knapp" id="oppna" target="_blank" rel="noopener">Öppna sidan</a>
        <span class="kopierad" id="kopierad" aria-live="polite"></span>
      </div>
    </div>
  </div>
</main>
<script>
function koda(text) {
  const bytes = new TextEncoder().encode(text);
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
const bas = new URL("./", location.href).href;
const mejl = document.getElementById("mejl");
mejl.addEventListener("input", () => {
  const v = mejl.value.trim().toLowerCase();
  const giltig = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  document.getElementById("resultat").hidden = !giltig;
  document.getElementById("kopierad").textContent = "";
  if (!giltig) return;
  const url = `${bas}?k=${koda(v)}`;
  document.getElementById("lank").textContent = url;
  document.getElementById("oppna").href = url;
});
document.getElementById("kopiera").addEventListener("click", async () => {
  const s = document.getElementById("kopierad");
  try {
    await navigator.clipboard.writeText(document.getElementById("lank").textContent);
    s.textContent = "Kopierad!";
  } catch {
    s.textContent = "Markera och kopiera länken manuellt.";
  }
});
</script>
</body>
</html>
